<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПринтКрафт × Артс&Крафтинг</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --badge-bg: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #334155;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .discount-badge {
            background-color: var(--badge-bg);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .contacts-card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .contacts-card p {
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .email-link {
            display: inline-block;
            color: var(--accent-color);
            font-size: 1.2rem;
            font-weight: 600;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .email-link:hover {
            background: rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ПринтКрафт × Артс&Крафтинг</h1>
        </header>

        <main>
            <h2 class="section-title">В продаже</h2>
            <div class="products-grid">
                
                <div class="product-card">
                    <div class="product-title">Лопатка</div>
                    <div class="product-footer">
                        <div class="product-price">48 ₽</div>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-title">Спиральный конус</div>
                    <div class="product-footer">
                        <div class="product-price">60 ₽</div>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-title">Бесконечный кубик-антистресс</div>
                    <div class="product-footer">
                        <div class="product-price">34 ₽</div>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-title">10-конечная звёздная игрушка</div>
                    <div class="product-footer">
                        <div class="product-price">87 ₽</div>
                        <span class="discount-badge">Скидка</span>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-title">Складной веер</div>
                    <div class="product-footer">
                        <div class="product-price">99 ₽</div>
                        <span class="discount-badge">Скидка</span>
                    </div>
                </div>

            </div>

            <section class="contacts-card">
                <h2 class="section-title" style="margin-bottom: 10px;">Контакты</h2>
                <p>Куда оставлять отзывы и написать, какую игрушку сделать:</p>
                <a href="mailto:kride2161@gmail.com" class="email-link">kride2161@gmail.com</a>
            </section>
        </main>
    </div>

</body>
</html>
